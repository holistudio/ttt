<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tic tac toe</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="header-slot">
      <header id="topbar" class="topbar">
        <div class="topbar-left">
          <button id="menu-btn" class="icon-btn" aria-label="Menu" aria-haspopup="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6H20M4 12H20M4 18H20" stroke="#000" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <div class="topbar-agents">
            <div class="agent-picker">
              <img src="static/img/cross.png" class="agent-icon" alt="X" />
              <select id="select-x" class="agent-select">
                <option value="" selected>select agent...</option>
                <option value="human">human</option>
                <option value="random">random</option>
                <option value="mcts">mcts</option>
                <option value="muzero">muzero</option>
              </select>
            </div>
            <div class="agent-picker">
              <img src="static/img/circle.png" class="agent-icon" alt="O" />
              <select id="select-o" class="agent-select">
                <option value="" selected>select agent...</option>
                <option value="human">human</option>
                <option value="random">random</option>
                <option value="mcts">mcts</option>
                <option value="muzero">muzero</option>
              </select>
            </div>
          </div>
        </div>
        <button id="new-game" class="btn hidden">New Game</button>
      </header>

      <h2 id="game-over-title" class="overlay-title hidden">Game Over</h2>
    </div>

    <div class="content">
      <div id="probs-x-panel" class="probs-panel side-left hidden">
        <img id="probs-x-label" src="static/img/cross.png" class="probs-label hidden" alt="X" />
        <div id="probs-x" class="probs-board hidden"></div>
        <div id="probs-x-count" class="probs-count hidden"></div>
      </div>
      <div id="board" class="board"></div>
      <div id="probs-o-panel" class="probs-panel side-right hidden">
        <img id="probs-o-label" src="static/img/circle.png" class="probs-label hidden" alt="O" />
        <div id="probs-o" class="probs-board hidden"></div>
        <div id="probs-o-count" class="probs-count hidden"></div>
      </div>

      <div class="footer-slot">
        <button id="play-again" class="btn btn-play-again hidden">Play Again</button>
        <button id="next-move" class="btn btn-play-again hidden">Next Move</button>
      </div>
    </div>
  </div>

  <div id="menu-overlay" class="menu-overlay hidden">
    <nav class="menu-list">
      <a class="menu-item" href="exploration_tree.html">muzero exploring tictactoe</a>
      <button id="menu-close" class="menu-item menu-close-btn">close</button>
    </nav>
  </div>

  <script src="static/js/main.js"></script>
</body>
</html>
