<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Every Tic-Tac-Toe Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  :root{
    --ink: #26282b;
    --muted: #6b6f76;
    --panel-bg: rgba(250,250,249,0.88);
    --panel-border: rgba(20,20,20,0.08);
    --x-blue: #2454c9;
    --o-red: #c73434;
  }
  html, body{
    margin:0; padding:0; overflow:hidden; height:100%;
    background:#d9d9d6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
  }
  #sketch-holder{ position:fixed; inset:0; }
  canvas{ display:block; touch-action:none; }

  .panel{
    position:fixed;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.09);
    backdrop-filter: blur(6px);
    padding: 14px 16px;
    z-index: 10;
  }
  #info-panel{ top:16px; left:16px; width: 268px; }
  #info-panel h1{
    margin:0 0 2px 0; font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;
  }
  #info-panel .sub{ font-size: 11.5px; color: var(--muted); margin-bottom: 10px; }
  #stats{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.7; color: #45484d;
    border-top: 1px solid var(--panel-border);
    padding-top: 8px; margin-top: 2px;
  }
  #stats b{ color: var(--ink); font-weight: 600; }
  .legend{ display:flex; flex-direction:column; gap:5px; margin-top:10px; border-top:1px solid var(--panel-border); padding-top:9px;}
  .legend-row{ display:flex; align-items:center; gap:8px; font-size:11px; color:#45484d; }
  .dot{ width:11px; height:11px; border-radius:50%; flex:none; }
  .controls{ font-size: 10.5px; color: var(--muted); margin-top:10px; border-top:1px solid var(--panel-border); padding-top:8px; line-height:1.6;}
  #reset-btn{
    margin-top:10px; width:100%; padding:7px 0; font-size:11.5px; font-weight:600;
    border-radius: 7px; border: 1px solid var(--panel-border); background: #fff; color: var(--ink);
    cursor:pointer;
  }
  #reset-btn:hover{ background:#f2f2f0; }

  #preview-panel{
    top:16px; right:16px; width: 200px;
    display:none;
    text-align:center;
  }
  #preview-panel .board-caption{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; color: #45484d; margin-top:8px; line-height:1.5;
  }
  #preview-panel .board-caption b{ color: var(--ink); }

  #episode-panel{
    bottom:16px; left:50%; transform:translateX(-50%);
    width: 340px;
    display:none;
    text-align:center;
  }
  #episode-panel .sub{ font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
  #episode-panel .sub b{ color: var(--ink); }
  #episode-slider{ width:100%; }

  #back-btn{
    top:16px; left:16px; width:40px; height:40px; padding:0;
    display:flex; align-items:center; justify-content:center;
    color: #000; text-decoration:none;
    background:#E0E0E0; border:1.5px solid #000;
    box-shadow:none; backdrop-filter:none;
  }
  #back-btn:hover{ background:#E0E0E0; }

  #loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:#55585d; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="sketch-holder"></div>

<a id="back-btn" class="panel" href="/" aria-label="Back to home" title="Back to home">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<div id="preview-panel" class="panel">
  <div id="preview-svg-holder"></div>
  <div class="board-caption" id="preview-caption"></div>
</div>

<div id="episode-panel" class="panel">
  <div class="sub" id="episode-label">Training episodes —</div>
  <input type="range" id="episode-slider" min="0" max="0" value="0" step="1">
</div>

<script>
// MuZero training exploration data (backend/agents/muzero/board_states_eps*_log.json),
// fetched from the backend so this reflects whatever training logs are on disk.
// Each entry is { label, start, end, counts }, sorted by episode range; counts
// keys are 9-char boards (1=X, 2=O, 0=empty) in RL action-index order, values
// are visit counts.
let MUZERO_EPISODE_LOGS = [];
async function loadMuzeroEpisodeLogs(){
  const res = await fetch('/api/muzero-episode-logs');
  MUZERO_EPISODE_LOGS = await res.json();
}
</script>
<script>
// Tweak these to change how dramatically node size reflects MuZero visit
// counts. Both are world-units (scaled by camera zoom, then clamped), same
// as the rest of the layout's spacing constants.
const MAX_NODE_RADIUS = 200;   // radius of the most-visited board state (also the hard on-screen cap at any zoom)
const MIN_NODE_RADIUS = 10; // radius of the least-visited (but still-visited) board state

/* ============================================================
   Tic-Tac-Toe complete game tree — data model
   ============================================================ */
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWinner(board){
  for (let i = 0; i < WIN_LINES.length; i++){
    const L = WIN_LINES[i];
    const a = board[L[0]], b = board[L[1]], c = board[L[2]];
    if (a && a === b && a === c) return a;
  }
  return null;
}

// Each episode log's counts keys are boards in RL action-index order, not
// this file's board-index order — rl_action_to_index is a matrix transpose
// (its own inverse), mirroring backend/app.py's encode_muzero_board_state.
function rlActionToIndex(action){ return (action % 3) * 3 + Math.floor(action / 3); }
function encodeMuzeroKey(board){
  let key = '';
  for (let action = 0; action < 9; action++){
    const mark = board[rlActionToIndex(action)];
    key += mark === 'X' ? '1' : mark === 'O' ? '2' : '0';
  }
  return key;
}

const LEAF_SPACING = 6;   // world-units between adjacent leaves
const MAX_DEPTH = 9;

// Builds a deduplicated state graph: distinct move sequences that reach the
// same exact board (same cell contents, same order of X/O — no symmetry
// folding) collapse onto one shared node with multiple incoming edges.
// Returns { root, levels, totalWidth }.
// levels[d] is every distinct board state at depth d, sorted ascending by .x
// after layout (depth === number of filled cells, so a board string is a
// unique key within its depth, and dedup only needs to happen per depth).
// muzeroCounts: dict of boardKey -> visit count (see encodeMuzeroKey), or
// falsy for the plain "every reachable state" tree. When given, a board
// state with no entry (or a count of 0) is pruned entirely — the node and
// every edge into/out of it are dropped before layout even runs, so the
// remaining nodes are spaced only against each other.
// layoutRef: optional { xByBoard: Map<boardKey,x>[], totalWidth } from a
// previous buildGameTree() call (the full tree's, in practice). When given,
// every surviving node reuses that call's x instead of computing its own —
// so every MuZero episode log's tree lines up on the exact same grid as the
// full tree and as each other, and switching between them never shifts a
// node that's present in both.
function buildGameTree(muzeroCounts, layoutRef){
  const levels = [];
  const byBoard = []; // byBoard[depth]: Map<boardKey, node>
  for (let i = 0; i <= MAX_DEPTH; i++){ levels.push([]); byBoard.push(new Map()); }
  let leafCounter = 0;

  function build(board, turn, depth){
    const key = board.join(',');
    const existing = byBoard[depth].get(key);
    if (existing) return existing;

    const winner = checkWinner(board);
    let isFull = true;
    for (let i = 0; i < 9; i++){ if (board[i] === null){ isFull = false; break; } }

    let node;
    if (winner){
      node = { board: board.slice(), depth, terminal: true, winner, children: null, x: 0 };
    } else if (isFull){
      node = { board: board.slice(), depth, terminal: true, winner: 'draw', children: null, x: 0 };
    } else {
      node = { board: board.slice(), depth, terminal: false, winner: null, children: [], x: 0 };
    }
    byBoard[depth].set(key, node);
    levels[depth].push(node);

    if (!node.terminal){
      for (let i = 0; i < 9; i++){
        if (board[i] === null){
          board[i] = turn;
          node.children.push(build(board, turn === 'X' ? 'O' : 'X', depth + 1));
          board[i] = null;
        }
      }
    }
    return node;
  }

  const root = build(new Array(9).fill(null), 'X', 0);

  // With muzeroCounts given: attach visit counts, then prune — drop every
  // node MuZero never visited, and drop it from any surviving parent's
  // children too, so its inbound and outbound edges disappear along with it.
  // With no muzeroCounts (the plain "every reachable state" view): every
  // node just keeps its full, un-pruned set of children.
  let maxVisits = 0;
  let prunedLevels = levels;
  if (muzeroCounts){
    for (let d = 0; d <= MAX_DEPTH; d++){
      for (const node of levels[d]){
        node.visits = muzeroCounts[encodeMuzeroKey(node.board)] || 0;
        if (node.visits > maxVisits) maxVisits = node.visits;
      }
    }
    prunedLevels = levels.map(lvl => lvl.filter(n => n.visits > 0));
    for (const lvl of prunedLevels){
      for (const node of lvl){
        if (node.children) node.children = node.children.filter(c => c.visits > 0);
      }
    }
  }

  if (layoutRef){
    for (let d = 0; d <= MAX_DEPTH; d++){
      for (const node of prunedLevels[d]){
        node.x = layoutRef.xByBoard[d].get(node.board.join(','));
      }
      // levels[d] is in DFS traversal order, not x order, even though the
      // x values themselves come pre-sorted from the reference — so this
      // still needs an explicit sort, same as the computed-layout path below.
      prunedLevels[d].sort((a, b) => a.x - b.x);
    }
    return { root, levels: prunedLevels, totalWidth: layoutRef.totalWidth, maxVisits };
  }

  // Position each distinct node exactly once (first time reached), so a
  // shared node keeps a single x regardless of how many parents point to it.
  // A node with no *surviving* children (game-terminal, or simply never
  // explored any further) is a leaf for layout purposes either way.
  function assignX(node){
    if (node._placed) return;
    node._placed = true;
    if (!node.children || node.children.length === 0){
      node.x = leafCounter * LEAF_SPACING;
      leafCounter++;
    } else {
      for (const c of node.children) assignX(c);
      let sum = 0;
      for (const c of node.children) sum += c.x;
      node.x = sum / node.children.length;
    }
  }
  assignX(root);
  for (let d = 0; d <= MAX_DEPTH; d++){
    prunedLevels[d].sort((a, b) => a.x - b.x);
    for (const node of prunedLevels[d]) delete node._placed;
  }

  // The pass above gives a sensible left-to-right ORDER per row (it follows
  // tree structure), but not even SPACING — leaves interleave across depths
  // in one global sequence, so any single row only gets a scattered subset
  // of it, and internal rows (averaged from children) inherit that unevenness.
  // Re-space every row uniformly across a shared width, keeping that order.
  let maxRowCount = 1;
  for (const lvl of prunedLevels) maxRowCount = Math.max(maxRowCount, lvl.length);
  const totalWidth = Math.max(1, maxRowCount - 1) * LEAF_SPACING;
  evenlySpaceLevels(prunedLevels, totalWidth);

  return { root, levels: prunedLevels, totalWidth, maxVisits };
}

// Redistributes each row's nodes uniformly across [0, totalWidth], preserving
// the left-to-right order they're already sorted in.
function evenlySpaceLevels(levels, totalWidth){
  for (const arr of levels){
    const n = arr.length;
    if (n === 0) continue;
    if (n === 1){ arr[0].x = totalWidth / 2; continue; }
    for (let i = 0; i < n; i++){
      arr[i].x = (i / (n - 1)) * totalWidth;
    }
  }
}

// binary search: first index with arr[i].x >= target
function lowerBound(arr, target){
  let lo = 0, hi = arr.length;
  while (lo < hi){
    const mid = (lo + hi) >> 1;
    if (arr[mid].x < target) lo = mid + 1; else hi = mid;
  }
  return lo;
}
function findNearest(arr, targetX){
  if (arr.length === 0) return null;
  const idx = lowerBound(arr, targetX);
  if (idx <= 0) return arr[0];
  if (idx >= arr.length) return arr[arr.length - 1];
  const before = arr[idx - 1], after = arr[idx];
  return (targetX - before.x) <= (after.x - targetX) ? before : after;
}
// Like findNearest, but skips nodes failing isVisible — walks outward from
// targetX in both directions (arr is x-sorted) until maxWorldDist is exceeded.
function findNearestVisible(arr, targetX, isVisible, maxWorldDist){
  if (arr.length === 0) return null;
  const idx = lowerBound(arr, targetX);
  let lo = idx - 1, hi = idx;
  while (lo >= 0 || hi < arr.length){
    const dHi = hi < arr.length ? arr[hi].x - targetX : Infinity;
    const dLo = lo >= 0 ? targetX - arr[lo].x : Infinity;
    if (dHi > maxWorldDist && dLo > maxWorldDist) break;
    if (dHi <= dLo){
      if (isVisible(arr[hi])) return arr[hi];
      hi++;
    } else {
      if (isVisible(arr[lo])) return arr[lo];
      lo--;
    }
  }
  return null;
}

// All nodes that can still reach `target` by following children edges
// (i.e. every node lying on some root→target move sequence, target included).
function computeCanReachSet(root, target){
  const memo = new Map();
  const result = new Set();
  function visit(node){
    if (memo.has(node)) return memo.get(node);
    memo.set(node, false); // guard (graph is acyclic, but keeps this safe)
    let can = node === target;
    if (node.children){
      for (const c of node.children){
        if (visit(c)) can = true;
      }
    }
    memo.set(node, can);
    if (can) result.add(node);
    return can;
  }
  visit(root);
  return result;
}

// All nodes reachable from `target` by following children edges
// (i.e. every node lying on some target→leaf move sequence, target included).
function computeDescendantSet(target){
  const seen = new Set([target]);
  const stack = [target];
  while (stack.length){
    const node = stack.pop();
    if (node.children){
      for (const c of node.children){
        if (!seen.has(c)){ seen.add(c); stack.push(c); }
      }
    }
  }
  return seen;
}

/* ============================================================
   p5 sketch
   ============================================================ */
let tree = null, levels = null, totalWidth = 0;
let loading = true;
// The single largest visit count across every episode log (always the final
// log's root, since counts accumulate across training) — node radius is
// scaled against this, not each dataset's own max, so a node only ever
// renders at MAX_NODE_RADIUS if it matches the most-trained log's root.
let globalMaxVisits = 0;

// 'm' toggles between the full deduplicated game tree (every reachable
// state) and the MuZero exploration view (visited states only, sized by
// visit count). Both graphs are built once up front so the toggle is instant.
let muzeroMode = false;
let muzeroTree = null, fullTree = null;
// One built tree per entry in MUZERO_EPISODE_LOGS, indexed the same way, so
// the episode slider can switch between them instantly (no rebuild on drag).
let muzeroTreesByEpisode = [];
let selectedEpisodeIdx = -1;
const UNIFORM_NODE_RADIUS = MIN_NODE_RADIUS; // world-units; node size in the full-tree view, which has no visit counts to size by

let camX = 0, camScale = 1, minScale = 1, maxScale = 150;
let isDragging = false;
let hoveredNode = null;
let pinnedNode = null;
let pressX = 0, pressY = 0;
const CLICK_MOVE_THRESHOLD = 4; // px; below this, a press+release counts as a click, not a pan

// Cache so we only recompute the highlight sets when the highlighted node changes.
let highlightCache = { node: null, canReachSet: null, descendantSet: null };
function getHighlightSets(node){
  if (highlightCache.node !== node){
    highlightCache = {
      node,
      canReachSet: computeCanReachSet(tree.root, node),
      descendantSet: computeDescendantSet(node)
    };
  }
  return highlightCache;
}

const TOP_MARGIN = 46, BOTTOM_MARGIN = 34;
const MAX_PER_LEVEL = 2200;   // node draw budget per level per frame
const MAX_EDGES = 2200;       // edge draw budget per level-pair per frame

const BLUE = [36, 84, 201];
const RED  = [199, 52, 52];

// Node radius scales with MuZero visit count (sqrt, so it's area- rather
// than radius-proportional) in muzero mode, or is uniform in full-tree mode
// (which has no visit counts to size by) — then goes through the same
// camera-zoom scaling and clamp either way.
function nodeWorldRadius(node){
  if (!muzeroMode) return UNIFORM_NODE_RADIUS;
  if (!globalMaxVisits) return MIN_NODE_RADIUS;
  const frac = Math.sqrt((node.visits || 0) / globalMaxVisits);
  return MIN_NODE_RADIUS + frac * (MAX_NODE_RADIUS - MIN_NODE_RADIUS);
}
function nodeScreenRadius(node, camScale){
  const maxR = muzeroMode ? MAX_NODE_RADIUS : UNIFORM_NODE_RADIUS;
  return constrain(nodeWorldRadius(node) * camScale, 1, maxR);
}

function setup(){
  const holder = document.getElementById('sketch-holder');
  const c = createCanvas(windowWidth, windowHeight);
  c.parent(holder);
  pixelDensity(1);
  setTimeout(buildEverything, 30);
}

async function buildEverything(){
  await loadMuzeroEpisodeLogs();
  fullTree = buildGameTree(null);
  // Every MuZero episode tree below reuses these positions (see buildGameTree's
  // layoutRef param), so a given board state renders at the same x whichever
  // dataset or mode is showing — nothing shifts when the slider moves.
  const layoutRef = {
    xByBoard: fullTree.levels.map(lvl => new Map(lvl.map(n => [n.board.join(','), n.x]))),
    totalWidth: fullTree.totalWidth
  };
  muzeroTreesByEpisode = MUZERO_EPISODE_LOGS.map(log => buildGameTree(log.counts, layoutRef));
  selectedEpisodeIdx = 0; // default to the earliest log (episodes 0-999)
  muzeroTree = muzeroTreesByEpisode[selectedEpisodeIdx];
  globalMaxVisits = Math.max(0, ...muzeroTreesByEpisode.map(t => t.maxVisits));
  setupEpisodeSlider();
  applyMode();
  loading = false;
}

function setupEpisodeSlider(){
  const slider = document.getElementById('episode-slider');
  slider.min = 0;
  slider.max = Math.max(0, muzeroTreesByEpisode.length - 1);
  slider.value = selectedEpisodeIdx;
  slider.addEventListener('input', () => {
    selectedEpisodeIdx = parseInt(slider.value, 10);
    muzeroTree = muzeroTreesByEpisode[selectedEpisodeIdx];
    // fit=false: scrubbing the slider only swaps which dataset sizes the
    // nodes (shared layout means positions already match), so the camera
    // shouldn't jump back to the fitted view underneath the user.
    if (muzeroMode) applyMode(false);
    else updateEpisodeLabel();
  });
}

function updateEpisodeLabel(){
  const log = MUZERO_EPISODE_LOGS[selectedEpisodeIdx];
  const label = document.getElementById('episode-label');
  if (!log){ label.innerHTML = 'Training episodes &mdash;'; return; }
  const t = muzeroTreesByEpisode[selectedEpisodeIdx];
  const visited = t.levels.reduce((sum, lvl) => sum + lvl.length, 0);
  label.innerHTML =
    `Training episodes <b>${log.label}</b> &middot; ${visited} states visited &middot; max ${t.maxVisits} visits`;
}

// Switches which pre-built graph is active. The two graphs are built by
// separate buildGameTree() calls, so their nodes are different objects even
// for "the same" board — any hover/pin state pointing at the old graph's
// nodes has to be dropped when switching.
function applyMode(fit = true){
  tree = muzeroMode ? muzeroTree : fullTree;
  levels = tree.levels;
  totalWidth = tree.totalWidth;
  hoveredNode = null;
  pinnedNode = null;
  highlightCache = { node: null, canReachSet: null, descendantSet: null };
  document.getElementById('episode-panel').style.display = muzeroMode ? 'block' : 'none';
  updateEpisodeLabel();
  if (fit) fitWholeTree();
}

function keyPressed(){
  if (loading) return;
  if (key === 'm' || key === 'M'){
    muzeroMode = !muzeroMode;
    applyMode();
  }
}

function fitWholeTree(){
  if (!totalWidth) return;
  const fitScale = (width * 0.92) / totalWidth;
  minScale = fitScale * 0.5;
  maxScale = 160;
  camScale = constrain(fitScale, minScale, maxScale);
  camX = totalWidth / 2;
}

function rowY(depth, rowH){ return TOP_MARGIN + depth * rowH; }
// X-win / O-win nodes render half a row above their depth's normal row, so
// they read as distinct from the in-progress/draw nodes at the same depth.
function nodeY(node, rowH){
  const y = rowY(node.depth, rowH);
  return (node.terminal && node.winner !== 'draw') ? y - rowH / 2 : y;
}
function screenX(wx){ return (wx - camX) * camScale + width / 2; }
function worldX(sx){ return (sx - width / 2) / camScale + camX; }

function draw(){
  background(224);

  if (loading){
    noStroke(); fill(85);
    textAlign(CENTER, CENTER);
    textFont('monospace'); textSize(14);
    text('generating game state graph…', width / 2, height / 2);
    return;
  }

  const rowH = (height - TOP_MARGIN - BOTTOM_MARGIN) / MAX_DEPTH;
  const pad = 40 / camScale;
  const xmin = worldX(0) - pad;
  const xmax = worldX(width) + pad;

  // precompute visible index-ranges per level once
  const ranges = new Array(levels.length);
  for (let d = 0; d <= MAX_DEPTH; d++){
    const arr = levels[d];
    ranges[d] = [lowerBound(arr, xmin), lowerBound(arr, xmax)];
  }

  // ---- hover detection (computed up front so it can gate edge visibility) ----
  hoveredNode = findHoveredNode(rowH);
  const highlightNode = pinnedNode || hoveredNode;
  let canReachSet = null, descendantSet = null;
  if (highlightNode){
    const sets = getHighlightSets(highlightNode);
    canReachSet = sets.canReachSet;
    descendantSet = sets.descendantSet;
  }
  // An edge (p -> c) is part of "the sequences leading to" the highlighted
  // node when c can still reach it, and part of "the sequences after" it
  // when p is the node itself or one of its descendants.
  function edgeVisible(p, c){
    return !highlightNode || canReachSet.has(c) || descendantSet.has(p);
  }
  // Nodes are only pared down once a click pins a node — hover alone just
  // dims edges so exploring stays lightweight.
  function nodeVisible(node){
    return !pinnedNode || canReachSet.has(node) || descendantSet.has(node);
  }

  // ---- edges (drawn first, underneath nodes) ----
  stroke(0, 70); strokeWeight(0.7);
  for (let d = 0; d < MAX_DEPTH; d++){
    const arr = levels[d];
    const [s, e] = ranges[d];
    let total = 0;
    for (let i = s; i < e; i++){
      const node = arr[i];
      if (!node.children) continue;
      for (const child of node.children){
        if (edgeVisible(node, child)) total++;
      }
    }
    if (total === 0) continue;
    const step = total > MAX_EDGES ? Math.ceil(total / MAX_EDGES) : 1;
    let counter = 0;
    for (let i = s; i < e; i++){
      const node = arr[i];
      if (!node.children) continue;
      const sx0 = screenX(node.x);
      const y0 = nodeY(node, rowH);
      for (const child of node.children){
        if (!edgeVisible(node, child)) continue;
        if (counter % step === 0){
          line(sx0, y0, screenX(child.x), nodeY(child, rowH));
        }
        counter++;
      }
    }
  }

  // ---- nodes ----
  noStroke();
  for (let d = 0; d <= MAX_DEPTH; d++){
    const arr = levels[d];
    const [s, e] = ranges[d];
    let visibleCount = 0;
    for (let i = s; i < e; i++){ if (nodeVisible(arr[i])) visibleCount++; }
    if (visibleCount <= 0) continue;
    const step = visibleCount > MAX_PER_LEVEL ? Math.ceil(visibleCount / MAX_PER_LEVEL) : 1;
    let counter = 0;
    for (let i = s; i < e; i++){
      const node = arr[i];
      if (!nodeVisible(node)) continue;
      if (counter % step !== 0){ counter++; continue; }
      counter++;
      const sx = screenX(node.x);
      const y = nodeY(node, rowH);
      const r = nodeScreenRadius(node, camScale);
      if (!node.terminal){
        noStroke(); fill(15);
      } else if (node.winner === 'X'){
        noStroke(); fill(BLUE[0], BLUE[1], BLUE[2]);
      } else if (node.winner === 'O'){
        noStroke(); fill(RED[0], RED[1], RED[2]);
      } else {
        stroke(30); strokeWeight(0.8); fill(255);
      }
      ellipse(sx, y, r * 2, r * 2);
      noStroke();
    }
  }

  // ---- highlight ring + preview ----
  // The reduced tree stays anchored to the pinned node (highlightNode above),
  // but once pinned, hovering another visible node should still preview it.
  const displayNode = hoveredNode || pinnedNode;
  if (displayNode){
    const y = nodeY(displayNode, rowH);
    const sx = screenX(displayNode.x);
    const dr = nodeScreenRadius(displayNode, camScale);
    noFill(); stroke(20, 160); strokeWeight(displayNode === pinnedNode ? 2.2 : 1.4);
    ellipse(sx, y, Math.max(dr * 2 + 8, 14), Math.max(dr * 2 + 8, 14));
  }
  updatePreviewPanel(displayNode);

  // ---- mode indicator ----
  noStroke(); fill(90);
  textAlign(LEFT, BOTTOM); textFont('monospace'); textSize(11);
  text(
    (muzeroMode ? 'MuZero exploration (sized by visit count)' : 'Full game tree (every reachable state)') + ' — press M to toggle',
    12, height - 12
  );
}

function findHoveredNode(rowH){
  if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return null;
  const rawDepth = (mouseY - TOP_MARGIN) / rowH;
  const wx = worldX(mouseX);
  // Generous search window sized to the largest any node could render at;
  // the actual accept/reject test below uses each candidate's own radius.
  const maxR = muzeroMode ? MAX_NODE_RADIUS : UNIFORM_NODE_RADIUS;
  const maxPossibleR = constrain(maxR * camScale, 1, maxR);
  const searchThreshold = Math.max(9, maxPossibleR + 7);

  // While pinned, only visible (relevant) nodes are hoverable.
  let visSets = null;
  if (pinnedNode) visSets = getHighlightSets(pinnedNode);
  function isVisible(node){
    return !pinnedNode || visSets.canReachSet.has(node) || visSets.descendantSet.has(node);
  }

  // Win nodes render half a row above their depth, so a given mouseY could
  // be closest to either the row at floor(rawDepth) or ceil(rawDepth).
  let best = null, bestDist = Infinity, bestThreshold = 0;
  for (const d of new Set([Math.floor(rawDepth), Math.ceil(rawDepth)])){
    if (d < 0 || d > MAX_DEPTH) continue;
    const arr = levels[d];
    if (!arr || arr.length === 0) continue;
    const nearest = pinnedNode
      ? findNearestVisible(arr, wx, isVisible, searchThreshold / camScale)
      : findNearest(arr, wx);
    if (!nearest) continue;
    const sx = screenX(nearest.x), sy = nodeY(nearest, rowH);
    const dist = Math.hypot(sx - mouseX, sy - mouseY);
    if (dist < bestDist){
      bestDist = dist;
      best = nearest;
      bestThreshold = Math.max(9, nodeScreenRadius(nearest, camScale) + 7);
    }
  }
  return bestDist <= bestThreshold ? best : null;
}

/* ---- preview panel (board rendered as inline SVG for crisp lines/text) ---- */
let lastPreviewKey = null;
function updatePreviewPanel(node){
  const panel = document.getElementById('preview-panel');
  if (!node){
    panel.style.display = 'none';
    lastPreviewKey = null;
    return;
  }
  const key = node.board.join(',');
  panel.style.display = 'block';
  if (key === lastPreviewKey) return;
  lastPreviewKey = key;

  const size = 168, cell = size / 3, m = 2;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<rect x="0" y="0" width="${size}" height="${size}" fill="#fafaf9"/>`;
  for (let i = 1; i < 3; i++){
    svg += `<line x1="${i*cell}" y1="0" x2="${i*cell}" y2="${size}" stroke="#bbb" stroke-width="1.5"/>`;
    svg += `<line x1="0" y1="${i*cell}" x2="${size}" y2="${i*cell}" stroke="#bbb" stroke-width="1.5"/>`;
  }
  for (let i = 0; i < 9; i++){
    const cx = (i % 3) * cell + cell / 2;
    const cy = Math.floor(i / 3) * cell + cell / 2;
    const v = node.board[i];
    if (v === 'X'){
      const s = cell * 0.28;
      svg += `<line x1="${cx-s}" y1="${cy-s}" x2="${cx+s}" y2="${cy+s}" stroke="#2454c9" stroke-width="5" stroke-linecap="round"/>`;
      svg += `<line x1="${cx+s}" y1="${cy-s}" x2="${cx-s}" y2="${cy+s}" stroke="#2454c9" stroke-width="5" stroke-linecap="round"/>`;
    } else if (v === 'O'){
      svg += `<circle cx="${cx}" cy="${cy}" r="${cell*0.30}" fill="none" stroke="#c73434" stroke-width="5"/>`;
    }
  }
  svg += `</svg>`;
  document.getElementById('preview-svg-holder').innerHTML = svg;

  let statusLine;
  if (node.terminal){
    statusLine = node.winner === 'draw' ? 'Draw' : `<b>${node.winner} wins</b>`;
  } else {
    const next = node.depth % 2 === 0 ? 'X' : 'O';
    statusLine = node.depth === 0 ? 'Starting position' : `<b>${next}</b> to move`;
  }
  document.getElementById('preview-caption').innerHTML =
    `move ${node.depth} of 9 &middot; ${statusLine}`;
}

/* ---- interaction ---- */
// p5 binds its mouse handlers at the document level, not on the canvas
// element, so dragging a DOM overlay control (the episode slider, the reset
// button) still fires mousePressed/mouseDragged underneath — without this
// guard, sliding it panned the camera by the same motion.
function isOverlayEvent(event){
  return !!(event && event.target && event.target.closest && event.target.closest('.panel'));
}
function mousePressed(event){
  if (isOverlayEvent(event)) return;
  if (mouseY >= 0 && mouseY <= height) isDragging = true;
  pressX = mouseX; pressY = mouseY;
}
function mouseReleased(event){
  isDragging = false;
  if (isOverlayEvent(event)) return;
  const moved = Math.hypot(mouseX - pressX, mouseY - pressY);
  if (moved < CLICK_MOVE_THRESHOLD){
    // Click a node to pin the reduced tree to it; click that same node again,
    // or click empty space, to unpin. Clicking a different node re-pins to it directly.
    pinnedNode = (hoveredNode && hoveredNode !== pinnedNode) ? hoveredNode : null;
  }
}
function mouseDragged(){
  if (loading || !isDragging) return;
  camX -= (mouseX - pmouseX) / camScale;
  camX = constrain(camX, -totalWidth * 0.2, totalWidth * 1.2);
}
function mouseWheel(event){
  if (loading || isOverlayEvent(event)) return;
  const newScale = constrain(camScale * Math.exp(-event.delta * 0.0018), minScale, maxScale);
  const wx = worldX(mouseX);
  camScale = newScale;
  camX = constrain(wx - (mouseX - width / 2) / camScale, -totalWidth * 0.2, totalWidth * 1.2);
  return false;
}
function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
}
</script>
